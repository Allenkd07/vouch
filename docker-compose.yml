# Pinned so the data volume (job-matcher_pgdata) survives renaming this folder.
name: job-matcher

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobmatcher
      POSTGRES_PASSWORD: jobmatcher
      POSTGRES_DB: jobmatcher
    ports:
      - "5433:5432" # 5432 is taken by a local Postgres on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
