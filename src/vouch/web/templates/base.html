<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vouch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/jobs">Vouch</a>
    <nav aria-label="Main">
      {% set here = request.url.path %}
      <a href="/matches" {% if here.startswith('/matches') %}aria-current="page"{% endif %}>Matches</a>
      <a href="/jobs" {% if here.startswith('/jobs') or here.startswith('/versions') %}aria-current="page"{% endif %}>Jobs</a>
      <a href="/applications" {% if here.startswith('/applications') %}aria-current="page"{% endif %}>Applications</a>
      <a href="/profile" {% if here.startswith('/profile') %}aria-current="page"{% endif %}>Profile</a>
    </nav>
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
